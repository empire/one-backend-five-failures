# Step 4: the third-party calls move to a queue (Redis Streams in the state store) and a worker.
# Every container below is capped at 1 CPU, so a limit shows up with a small test.
#
#   make up                  the queue and the worker (the default)
#   make up DEDUPE=off       the worker does not drop repeated events (to see why it does)
#   make up LIMITER=off      no limit (step 3's failure); CACHE=off: every open reads the database (step 2's)
#   make up SESSIONS=memory  sessions in each app's memory (step 1's failure)
name: shortener

x-app: &app
  build: .
  command: app
  cpus: 1
  environment:
    DATABASE_URL: postgres://shortener:shortener@db:5432/shortener?pool_max_conns=10
    STATE_URL: redis://state:6379/0
    CACHE_URL: redis://cache:6379/0
    SESSIONS: ${SESSIONS:-redis}
    CACHE: ${CACHE:-redis}
    LIMITER: ${LIMITER:-on}
    BUCKET_SIZE: 10
    REFILL_PER_S: 2
  depends_on:
    db: {condition: service_healthy}
    state: {condition: service_started}
    cache: {condition: service_started}

services:
  db:
    image: postgres:17
    cpus: 1
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shortener"]
      interval: 2s
      timeout: 3s
      retries: 20

  state:
    image: redis:7-alpine
    cpus: 1

  # Only copies of rows that are also in the database. It is set to forget: 64 MB, least recently used first.
  # It is not the state store above, which holds sessions that exist nowhere else.
  cache:
    image: redis:7-alpine
    cpus: 1
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  thirdparty:
    build: .
    command: thirdparty
    cpus: 1
    ports: ["9000:9000"]

  # Calls the third-party APIs for the jobs the apps queue. Its /debug/vars (port 8093) is for the measuring tools.
  worker:
    build: .
    command: worker
    cpus: 1
    environment:
      DATABASE_URL: postgres://shortener:shortener@db:5432/shortener?pool_max_conns=10
      STATE_URL: redis://state:6379/0
      CACHE_URL: redis://cache:6379/0
      SCAN_URL: http://thirdparty:9000/scan
      ANALYTICS_URL: http://thirdparty:9000/analytics
      DEDUPE: ${DEDUPE:-on}
      JITTER: ${JITTER:-on}
    ports: ["127.0.0.1:8093:8080"]
    depends_on:
      db: {condition: service_healthy}
      state: {condition: service_started}
      cache: {condition: service_started}
      thirdparty: {condition: service_started}

  # The ports below are for the measuring tools (they read each app's /debug/vars); the load goes through lb.
  app1:
    <<: *app
    ports: ["127.0.0.1:8091:8080"]
  app2:
    <<: *app
    ports: ["127.0.0.1:8092:8080"]

  lb:
    image: haproxy:3.0-alpine
    cpus: 1
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["${APP_PORT:-8088}:80"]
    depends_on: [app1, app2]
