# Round robin over both apps. A server that stops answering is taken out after two failed checks,
# and a request that cannot reach one is sent to the other.
global
    nbthread 1                  # the container has 1 CPU; more threads would only fight over it

defaults
    mode http
    timeout connect 1s
    timeout client  10s
    timeout server  10s
    retries 3
    option redispatch           # a failed connection is retried on another server
    retry-on conn-failure empty-response 502 503 504

# Docker's DNS: an app that is restarted gets a new address, and the balancer follows it.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend web
    bind :80
    default_backend apps

backend apps
    balance roundrobin
    default-server check inter 1s fall 2 rise 1 resolvers docker init-addr libc,none
    server app1 app1:8080
    server app2 app2:8080
